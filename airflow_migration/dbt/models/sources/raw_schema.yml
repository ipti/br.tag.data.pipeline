sources:
  - name: raw
    description: "Schema RAW - Dados brutos importados diretamente das fontes MySQL"
    tags: ["raw", "landing", "mysql-import"]
    tables:
      - name: classroom
        description: "Tabela de salas de aula importada do MySQL - dados brutos sem transformação"
        tags: ["education", "classroom", "raw-import"]
        columns:
          - name: id
            description: "ID original da sala de aula no sistema MySQL"
            data_type: "int"
            data_tests:
              - not_null
              - unique
          - name: school_inep_fk
            description: "Chave estrangeira para escola (código INEP)"
            data_type: "varchar(50)"
          - name: created_at
            description: "Data de criação do registro no sistema origem"
            data_type: "datetime2"
          - name: updated_at
            description: "Data de última atualização no sistema origem"
            data_type: "datetime2"
          - name: inserted_at
            description: "Timestamp de inserção no data warehouse"
            data_type: "datetime2"
            data_tests:
              - not_null
          - name: database_name
            description: "Nome do banco de dados de origem"
            data_type: "varchar(255)"
          - name: edcenso_stage_vs_modality_fk
            description: "Chave estrangeira para modalidade de ensino"
            data_type: "varchar(50)"
          - name: school_year
            description: "Ano letivo"
            data_type: "int"