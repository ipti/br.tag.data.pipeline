name: 'dbt_tia'
version: '1.0.0'
config-version: 2

profile: 'dbt_tia'

target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"

model-paths: ["models"]
analysis-paths: ["analysis"]
test-paths: ["tests"]
seed-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

models:
  dbt_tia:
    +materialized: ephemeral #dont create views or tables, just references
    staging:
      +materialized: ephemeral

data_tests:
  dbt_tia:
    +severity: warn

vars:
  schema_prod: 'dbo_tia'
  schema_dev: 'dbo_tia_dev'
  database_name: 'data-warehouse-tag'