table_name: "student_enrollment"
description: "student_enrollment accumulated table for student_faults calculation"
source_name: "{SOURCE_NAME}"
target_schema: "raw"

incremental_config:
  source_timestamp_columns: ["updated_at"]
  target_timestamp_column: "updated_at"
  lookback_hours: 24
  batch_size: 10000
  full_refresh: false

upsert_config:
  source_key_columns: ["student_fk", "database_name", "classroom_fk"]
  target_key_columns: ["student_fk", "database_name", "classroom_fk"]

optional_filters:
  - database_name
filter_sources:
  database_name: databases_mysql.yml