table_name: "d_student_discipline"
description: "Student discipline results dimension table"
source_name: "{SOURCE_NAME}"
target_schema: "{TARGET_SCHEMA}"

incremental_config:
  source_timestamp_columns: ["updated_at"]
  target_timestamp_column: "inserted_at"
  lookback_hours: 24
  batch_size: 10000
  full_refresh: false

upsert_config:
  source_key_columns: ["HASH_ID"]
  target_key_columns: ["HASH_ID"]

optional_filters:
  - database_name
filter_sources:
  database_name: databases_mysql.yml