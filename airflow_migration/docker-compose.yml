# docker-compose.yml para Airflow 3.x
networks:
  airflow-network:
    external: true

x-airflow-common:
  &airflow-common
  image: my-airflow-sqlserver:latest
  networks:
    - airflow-network
  env_file:
    - ./.env
  environment: &airflow-common-env
    PYTHONPATH: /opt/airflow/src:/opt/airflow/plugins:/opt/airflow
    AIRFLOW__CORE__PLUGINS_FOLDER: /opt/airflow/plugins
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "mysql+mysqldb://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT:-3306}/${MYSQL_DATABASE}"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-webserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET}
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    
    # MySQL connection variables
    MYSQL_HOST: ${MYSQL_HOST:-mysql}
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    MYSQL_USER: ${MYSQL_USER:-airflow}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-airflow}
    
    # Webserver default user (não funciona em Airflow 3.x)
    AIRFLOW__WEBSERVER__DEFAULT_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
    AIRFLOW__WEBSERVER__DEFAULT_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin123}
  
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt
    - ${AIRFLOW_PROJ_DIR:-.}/src:/opt/airflow/src
  user: "${AIRFLOW_UID:-50000}:0"

services:
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        # Criar diretórios necessários
        mkdir -p /sources/logs /sources/dags /sources/plugins
        chown -R "${AIRFLOW_UID}:0" /sources/logs /sources/dags /sources/plugins
        
        # Migrar banco de dados
        echo "Running database migration..."
        airflow db migrate
        
        airflow users create \
          -u ${_AIRFLOW_WWW_USER_USERNAME:-airflow-dev} \
          -p ${_AIRFLOW_WWW_USER_PASSWORD:-airflow-dev} \
          -f Admin \
          -l User \
          -r Admin \
          -e admin@example.com 2>&1 || echo "User may already exist"
        
        # Sincronizar permissões
        echo "Syncing permissions..."
        airflow sync-perm
        
        echo "Initialization complete!"
        echo "====================================="
        echo "Login credentials:"
        echo "Username: ${_AIRFLOW_WWW_USER_USERNAME:-airflow-dev}"
        echo "Password: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow-dev}"
        echo "====================================="
    
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow-dev}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow-dev}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}:/sources

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8793/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: airflow-triggerer
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  dbt-docs:
    <<: *airflow-common
    container_name: dbt-docs
    command: >
      bash -c "
      cd /opt/airflow/dbt &&
      dbt deps &&
      dbt docs generate &&
      dbt docs serve --host 0.0.0.0 --port 8085"
    ports:
      - "8085:8085"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully